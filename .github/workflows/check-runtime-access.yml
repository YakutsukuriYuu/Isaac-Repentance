name: Check private runtime access
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check resource access without exposing credentials
        env:
          ISAAC_RUNTIME_URL: ${{ secrets.ISAAC_RUNTIME_URL }}
          ISAAC_RUNTIME_TOKEN: ${{ secrets.ISAAC_RUNTIME_TOKEN }}
        run: python3 packaging/scripts/probe_runtime_access.py
